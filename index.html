<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EA Performance — Live</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
  :root{
    --bg:#12161c;
    --panel:#1b212a;
    --border:#2a323d;
    --text:#e7eaee;
    --muted:#8b94a1;
    --brand:#5b8def;
    --gain:#3ddc84;
    --loss:#ff5c5c;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.45;
  }
  .num{ font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace; font-variant-numeric:tabular-nums; }

  header{
    padding:28px 32px 20px;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    flex-wrap:wrap;
    gap:8px;
  }
  header h1{
    font-size:1.35rem;
    font-weight:650;
    margin:0;
    letter-spacing:-0.01em;
  }
  header .meta{ color:var(--muted); font-size:0.85rem; }
  header .dot{
    display:inline-block; width:8px; height:8px; border-radius:50%;
    background:var(--gain); margin-right:6px;
    box-shadow:0 0 0 3px rgba(61,220,132,0.15);
  }

  main{ max-width:1080px; margin:0 auto; padding:28px 32px 60px; }

  .accountpick{ margin-bottom:20px; }
  .accountpick select{
    background:var(--panel); color:var(--text); border:1px solid var(--border);
    border-radius:8px; padding:8px 12px; font-size:0.9rem;
  }

  .stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:1px;
    background:var(--border);
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    margin-bottom:28px;
  }
  .stat{ background:var(--panel); padding:20px 22px; }
  .stat .label{ color:var(--muted); font-size:0.78rem; margin-bottom:8px; }
  .stat .value{ font-size:1.6rem; font-weight:600; }
  .stat .value.gain{ color:var(--gain); }
  .stat .value.loss{ color:var(--loss); }

  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:22px 24px;
    margin-bottom:24px;
  }
  .panel h2{
    font-size:0.95rem; font-weight:600; margin:0 0 16px;
    color:var(--text);
  }
  .panel h2 span{ color:var(--muted); font-weight:400; font-size:0.82rem; }

  table{ width:100%; border-collapse:collapse; font-size:0.87rem; }
  th{
    text-align:left; color:var(--muted); font-weight:500;
    padding:8px 10px; border-bottom:1px solid var(--border); font-size:0.78rem;
  }
  th.sortable{ cursor:pointer; user-select:none; }
  th.sortable:hover{ color:var(--text); }
  td{ padding:9px 10px; border-bottom:1px solid var(--border); }
  tr:last-child td{ border-bottom:none; }
  td.num, th.num{ text-align:right; }
  .empty{ color:var(--muted); text-align:center; padding:30px 0; font-size:0.87rem; }

  .filterrow{ display:flex; align-items:center; gap:8px; margin-bottom:14px; font-size:0.85rem; color:var(--muted); }
  .filterrow select{
    background:var(--bg); color:var(--text); border:1px solid var(--border);
    border-radius:6px; padding:5px 10px; font-size:0.85rem;
  }

  .eacard{
    display:grid; grid-template-columns:1.2fr repeat(5,1fr); gap:1px;
    background:var(--border); border:1px solid var(--border); border-radius:10px;
    overflow:hidden; margin-bottom:1px;
  }
  .eacard > div{ background:var(--panel); padding:12px 14px; }
  .eacard .ealabel{ font-weight:600; }
  .eacard .ealabel .sub{ display:block; color:var(--muted); font-weight:400; font-size:0.75rem; margin-top:2px; }
  .eacard .col-label{ color:var(--muted); font-size:0.72rem; margin-bottom:3px; }
  .eahead{ font-size:0.72rem; color:var(--muted); padding:6px 14px; }

  canvas{ max-height:280px; }
</style>
</head>
<body>

<header>
  <h1>EA Performance</h1>
  <div class="meta"><span class="dot"></span><span id="lastUpdate">connessione in corso…</span></div>
</header>

<main>
  <div class="accountpick">
    <select id="accountSelect"><option>Caricamento conti…</option></select>
  </div>

  <div class="stats">
    <div class="stat"><div class="label">Equity</div><div class="value num" id="stEquity">—</div></div>
    <div class="stat"><div class="label">Saldo</div><div class="value num" id="stBalance">—</div></div>
    <div class="stat"><div class="label">P/L flottante</div><div class="value num" id="stProfit">—</div></div>
    <div class="stat"><div class="label">Drawdown</div><div class="value num" id="stDD">—</div></div>
  </div>

  <div class="panel">
    <h2>Per Expert Advisor <span id="eaSubtitle">— raggruppato per magic number</span></h2>
    <div id="eaWrap"><div class="empty">In attesa di dati…</div></div>
  </div>

  <div class="panel">
    <h2>Operazioni chiuse <span id="tradesSubtitle"></span></h2>
    <div class="filterrow">
      <label for="magicFilter">Filtra per EA:</label>
      <select id="magicFilter"><option value="">Tutti</option></select>
    </div>
    <div id="tradesWrap">
      <div class="empty">In attesa di dati…</div>
    </div>
  </div>
</main>

<script>
  // ====== CONFIGURA QUI ======
  // Incolla qui il firebaseConfig del tuo progetto (Console Firebase > Impostazioni progetto > Le tue app > SDK setup)
  const firebaseConfig = {
    apiKey: "AIzaSyACC2UH3ICtaUcOtll4Rvfw9ScNH9iNhWc",
    authDomain: "ea-reporter.firebaseapp.com",
    databaseURL: "https://ea-reporter-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "ea-reporter",
    storageBucket: "ea-reporter.firebasestorage.app",
    messagingSenderId: "779680385090",
    appId: "1:779680385090:web:498c492f1116881832c5db"
  };
  // ============================

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const fmt = (n, c) => (n === undefined || n === null) ? "—" :
    new Intl.NumberFormat("it-IT", {style: c ? "currency" : "decimal", currency: c || undefined, maximumFractionDigits: 2}).format(n);
  const fmtDate = (unixSec) => new Date(unixSec * 1000).toLocaleString("it-IT");

  let currentAccount = null;
  const accountSelect = document.getElementById("accountSelect");

  // Elenca gli account presenti sotto /accounts e popola il selettore
  db.ref("accounts").on("value", (snap) => {
    const accounts = snap.val() || {};
    const ids = Object.keys(accounts);
    accountSelect.innerHTML = ids.length
      ? ids.map(id => `<option value="${id}">${id}</option>`).join("")
      : "<option>Nessun conto ancora</option>";
    if(!currentAccount && ids.length){
      currentAccount = ids[0];
      accountSelect.value = currentAccount;
      watchAccount(currentAccount);
    }
  });

  accountSelect.addEventListener("change", (e) => watchAccount(e.target.value));

  function watchAccount(accountId){
    currentAccount = accountId;

    db.ref(`accounts/${accountId}/status`).on("value", (snap) => {
      const s = snap.val();
      if(!s) return;
      const currency = s.currency || "";
      document.getElementById("stEquity").textContent = fmt(s.equity, currency);
      document.getElementById("stBalance").textContent = fmt(s.balance, currency);
      const profitEl = document.getElementById("stProfit");
      profitEl.textContent = fmt(s.profit, currency);
      profitEl.className = "value num " + (s.profit >= 0 ? "gain" : "loss");
      const ddEl = document.getElementById("stDD");
      ddEl.textContent = (s.drawdown_pct ?? 0).toFixed(2) + " %";
      ddEl.className = "value num " + (s.drawdown_pct > 5 ? "loss" : "");
      document.getElementById("lastUpdate").textContent =
        "aggiornato " + fmtDate(s.updated_at) + (s.broker ? " · " + s.broker : "");
    });

    db.ref(`accounts/${accountId}/trades`).orderByChild("closed_at").limitToLast(500).on("value", (snap) => {
      const val = snap.val() || {};
      allTrades = Object.values(val).sort((a,b) => b.closed_at - a.closed_at);
      renderMagicFilter(allTrades);
      renderEaSummary(allTrades);
      renderTrades(filterByMagic(allTrades));
    });
  }

  let allTrades = [];
  let selectedMagic = "";

  function filterByMagic(trades){
    if(selectedMagic === "") return trades;
    return trades.filter(t => String(t.magic) === selectedMagic);
  }

  const magicFilter = document.getElementById("magicFilter");
  magicFilter.addEventListener("change", (e) => {
    selectedMagic = e.target.value;
    renderTrades(filterByMagic(allTrades));
  });

  function renderMagicFilter(trades){
    const magics = [...new Set(trades.map(t => String(t.magic ?? 0)))].sort();
    const current = magicFilter.value;
    magicFilter.innerHTML = '<option value="">Tutti</option>' +
      magics.map(m => `<option value="${m}">Magic ${m}</option>`).join("");
    magicFilter.value = magics.includes(current) ? current : "";
    selectedMagic = magicFilter.value;
  }

  function renderEaSummary(trades){
    const wrap = document.getElementById("eaWrap");
    if(!trades.length){
      wrap.innerHTML = '<div class="empty">Nessuna operazione chiusa ancora</div>';
      return;
    }
    const groups = {};
    trades.forEach(t => {
      const key = String(t.magic ?? 0);
      if(!groups[key]) groups[key] = { magic: key, count:0, wins:0, netSum:0, lots:0, lastComment:"" };
      const g = groups[key];
      const net = t.net ?? t.profit ?? 0;
      g.count++;
      if(net >= 0) g.wins++;
      g.netSum += net;
      g.lots += (t.volume ?? 0);
      if(!g.lastComment && t.comment) g.lastComment = t.comment;
    });
    const rows = Object.values(groups).sort((a,b) => b.netSum - a.netSum).map(g => `
      <div class="eacard">
        <div class="ealabel">Magic ${g.magic}<span class="sub">${g.lastComment || "—"}</span></div>
        <div><div class="col-label">Operazioni</div>${g.count}</div>
        <div><div class="col-label">Win rate</div>${((g.wins/g.count)*100).toFixed(0)}%</div>
        <div><div class="col-label">Lotti tot.</div>${g.lots.toFixed(2)}</div>
        <div><div class="col-label">Netto</div><span style="color:${g.netSum>=0?'var(--gain)':'var(--loss)'}">${fmt(g.netSum)}</span></div>
        <div><div class="col-label">Media/trade</div>${fmt(g.netSum/g.count)}</div>
      </div>`).join("");
    wrap.innerHTML = `
      <div class="eahead" style="display:grid;grid-template-columns:1.2fr repeat(5,1fr);">
        <div>EA</div><div>Operazioni</div><div>Win rate</div><div>Lotti tot.</div><div>Netto</div><div>Media/trade</div>
      </div>${rows}`;
  }

  function renderTrades(trades){
    const wrap = document.getElementById("tradesWrap");
    document.getElementById("tradesSubtitle").textContent = `— ${trades.length} operazioni`;
    if(!trades.length){
      wrap.innerHTML = '<div class="empty">Nessuna operazione trovata</div>';
      return;
    }
    const sorted = sortTrades(trades);
    const rows = sorted.slice(0, 100).map(t => `
      <tr>
        <td>${fmtDate(t.closed_at)}</td>
        <td>${t.symbol || ""}</td>
        <td>${t.type === "buy_close" ? "Buy" : "Sell"}</td>
        <td class="num">${(t.volume ?? 0).toFixed(2)}</td>
        <td>${t.comment || ""}</td>
        <td class="num">${t.magic ?? 0}</td>
        <td class="num" style="color:${(t.net ?? t.profit) >= 0 ? 'var(--gain)' : 'var(--loss)'}">${fmt(t.net ?? t.profit)}</td>
      </tr>`).join("");
    const cols = [
      {key:"closed_at", label:"Chiusa il"},
      {key:"symbol", label:"Simbolo"},
      {key:"type", label:"Verso"},
      {key:"volume", label:"Lotti", num:true},
      {key:"comment", label:"Commento"},
      {key:"magic", label:"Magic", num:true},
      {key:"net", label:"Netto", num:true}
    ];
    const head = cols.map(c => {
      const active = sortState.key === c.key;
      const arrow = active ? (sortState.dir === 1 ? " ▲" : " ▼") : "";
      return `<th class="${c.num?'num':''} sortable" data-key="${c.key}">${c.label}${arrow}</th>`;
    }).join("");
    wrap.innerHTML = `
      <table>
        <thead><tr>${head}</tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
    wrap.querySelectorAll("th.sortable").forEach(th => {
      th.addEventListener("click", () => {
        const key = th.dataset.key;
        if(sortState.key === key) sortState.dir *= -1;
        else { sortState.key = key; sortState.dir = key === "closed_at" ? -1 : 1; }
        renderTrades(trades);
      });
    });
  }

  let sortState = { key: "closed_at", dir: -1 };

  function sortTrades(trades){
    const key = sortState.key, dir = sortState.dir;
    return trades.slice().sort((a, b) => {
      let av = key === "net" ? (a.net ?? a.profit ?? 0) : a[key];
      let bv = key === "net" ? (b.net ?? b.profit ?? 0) : b[key];
      if(typeof av === "string" || typeof bv === "string"){
        av = (av ?? "").toString().toLowerCase();
        bv = (bv ?? "").toString().toLowerCase();
        return av < bv ? -1*dir : av > bv ? 1*dir : 0;
      }
      return ((av ?? 0) - (bv ?? 0)) * dir;
    });
  }
</script>
</body>
</html>
