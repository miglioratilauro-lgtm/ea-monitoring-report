<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EA Performance — Live</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
  :root{
    --bg:#12161c;
    --panel:#1b212a;
    --border:#2a323d;
    --text:#e7eaee;
    --muted:#8b94a1;
    --brand:#5b8def;
    --gold:#e0b84a;
    --gain:#3ddc84;
    --loss:#ff5c5c;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.45;
  }
  .num{ font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace; font-variant-numeric:tabular-nums; }

  header{
    padding:28px 32px 20px;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    flex-wrap:wrap;
    gap:8px;
  }
  header h1{ font-size:1.35rem; font-weight:650; margin:0; letter-spacing:-0.01em; }
  header .meta{ color:var(--muted); font-size:0.85rem; }
  header .dot{
    display:inline-block; width:8px; height:8px; border-radius:50%;
    background:var(--gain); margin-right:6px;
    box-shadow:0 0 0 3px rgba(61,220,132,0.15);
  }

  main{ max-width:1180px; margin:0 auto; padding:28px 32px 60px; }

  .accountpick{ display:flex; align-items:center; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
  .accountpick select{
    background:var(--panel); color:var(--text); border:1px solid var(--border);
    border-radius:8px; padding:8px 12px; font-size:0.9rem;
  }
  .iconbtn{
    background:var(--panel); color:var(--muted); border:1px solid var(--border);
    border-radius:8px; padding:7px 12px; font-size:0.8rem; cursor:pointer;
  }
  .iconbtn:hover{ color:var(--text); border-color:#3a4453; }
  .linkbtn{
    background:none; border:none; color:var(--muted); font-size:0.78rem;
    text-decoration:underline; cursor:pointer; padding:0;
  }
  .linkbtn:hover{ color:var(--text); }

  .stats{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:1px;
    background:var(--border);
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    margin-bottom:28px;
  }
  .stat{ background:var(--panel); padding:18px 18px; }
  .stat .label{ color:var(--muted); font-size:0.74rem; margin-bottom:8px; }
  .stat .value{ font-size:1.35rem; font-weight:600; }
  .stat .value.small{ font-size:1.05rem; }
  .stat .value.gain{ color:var(--gain); }
  .stat .value.loss{ color:var(--loss); }

  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:22px 24px;
    margin-bottom:24px;
  }
  .panel h2{ font-size:0.95rem; font-weight:600; margin:0 0 16px; color:var(--text); }
  .panel h2 span{ color:var(--muted); font-weight:400; font-size:0.82rem; }

  table{ width:100%; border-collapse:collapse; font-size:0.87rem; }
  th{
    text-align:left; color:var(--muted); font-weight:500;
    padding:8px 10px; border-bottom:1px solid var(--border); font-size:0.78rem;
    white-space:nowrap;
  }
  th.sortable{ cursor:pointer; user-select:none; }
  th.sortable:hover{ color:var(--text); }
  td{ padding:9px 10px; border-bottom:1px solid var(--border); }
  tr:last-child td{ border-bottom:none; }
  td.num, th.num{ text-align:right; }
  .empty{ color:var(--muted); text-align:center; padding:30px 0; font-size:0.87rem; }
  .eaname{ font-weight:600; }
  .eaname .sub{ display:block; color:var(--muted); font-weight:400; font-size:0.74rem; margin-top:1px; }

  .filterrow{ display:flex; align-items:center; gap:16px; margin-bottom:14px; font-size:0.85rem; color:var(--muted); flex-wrap:wrap; }
  .filterrow .fgroup{ display:flex; align-items:center; gap:6px; }
  .filterrow select{
    background:var(--bg); color:var(--text); border:1px solid var(--border);
    border-radius:6px; padding:5px 10px; font-size:0.85rem;
  }

  .top5row{
    display:flex; align-items:center; gap:12px; padding:10px 0;
    border-bottom:1px solid var(--border);
  }
  .top5row:last-child{ border-bottom:none; }
  .top5rank{
    width:22px; height:22px; border-radius:50%; background:var(--bg);
    display:flex; align-items:center; justify-content:center;
    font-size:0.72rem; font-weight:700; color:var(--muted); flex-shrink:0;
  }
  .top5row:nth-child(1) .top5rank{ background:var(--gold); color:#12161c; }
  .top5name{ flex:1; font-weight:600; font-size:0.88rem; }
  .top5name .sub{ display:block; color:var(--muted); font-weight:400; font-size:0.72rem; }
  .top5net{ font-weight:600; }
  .top5row{ cursor:pointer; }
  .top5row:hover{ background:rgba(255,255,255,0.03); }
  tr.clickable{ cursor:pointer; }
  tr.clickable:hover{ background:rgba(255,255,255,0.03); }

  .periodrow{ display:flex; align-items:center; gap:8px; font-size:0.85rem; color:var(--muted); }
  .periodrow select{
    background:var(--bg); color:var(--text); border:1px solid var(--border);
    border-radius:6px; padding:5px 10px; font-size:0.85rem;
  }
  .chartsummary{ display:flex; gap:24px; margin-top:10px; font-size:0.82rem; color:var(--muted); flex-wrap:wrap; }
  .chartsummary b{ color:var(--text); }
</style>
</head>
<body>

<header>
  <h1>EA Performance <span id="headerBroker" style="color:var(--muted); font-weight:400;"></span></h1>
  <div class="meta"><span class="dot"></span><span id="lastUpdate">connessione in corso…</span></div>
</header>

<main>
  <div class="accountpick">
    <select id="accountSelect"><option>Caricamento conti…</option></select>
    <button class="iconbtn" id="hideAccountBtn" title="Nascondi questo conto dall'elenco">Nascondi questo conto</button>
    <button class="linkbtn" id="showHiddenBtn">mostra conti nascosti</button>
    <span style="flex:1"></span>
    <div class="periodrow">
      <label for="periodSelect">Storico:</label>
      <select id="periodSelect">
        <option value="today">Oggi</option>
        <option value="7d">Ultimi 7 giorni</option>
        <option value="30d">Ultimi 30 giorni</option>
        <option value="90d">Ultimi 90 giorni</option>
        <option value="365d">Ultimo anno</option>
        <option value="all" selected>Tutto lo storico</option>
      </select>
    </div>
  </div>
  <div class="meta" id="periodRangeLabel" style="margin:-10px 0 20px;"></div>

  <div class="stats">
    <div class="stat"><div class="label">Equity</div><div class="value num" id="stEquity">—</div></div>
    <div class="stat"><div class="label">Saldo</div><div class="value num" id="stBalance">—</div></div>
    <div class="stat"><div class="label">P/L flottante</div><div class="value num" id="stProfit">—</div></div>
    <div class="stat"><div class="label">Drawdown</div><div class="value num" id="stDD">—</div></div>
    <div class="stat"><div class="label">Broker</div><div class="value small" id="stBroker">—</div></div>
    <div class="stat"><div class="label">Leva</div><div class="value num" id="stLeverage">—</div></div>
  </div>

  <div class="panel">
    <h2>Top 5 Expert Advisor <span>— per netto realizzato</span></h2>
    <div id="top5Wrap"><div class="empty">In attesa di dati…</div></div>
  </div>

  <div class="panel">
    <h2>Per Expert Advisor <span id="eaSubtitle">— raggruppato per commento</span>
      <span style="float:right; font-size:0.8rem;">
        Raggruppa per:
        <button class="linkbtn" id="groupByComment" style="text-decoration:none; font-weight:600;">Commento</button> ·
        <button class="linkbtn" id="groupByMagic">Magic number</button>
      </span>
    </h2>
    <div id="eaWrap"><div class="empty">In attesa di dati…</div></div>
  </div>

  <div class="panel" id="chartPanel" style="display:none;">
    <h2 id="chartTitle">Andamento</h2>
    <div id="chartWrap"></div>
    <div class="chartsummary" id="chartSummary"></div>
  </div>

  <div class="panel">
    <h2>Operazioni chiuse <span id="tradesSubtitle"></span></h2>
    <div class="filterrow">
      <div class="fgroup"><label for="magicFilter">EA:</label>
        <select id="magicFilter"><option value="">Tutti</option></select></div>
      <div class="fgroup"><label for="commentFilter">Commento:</label>
        <select id="commentFilter"><option value="">Tutti</option></select></div>
      <div class="fgroup"><label for="symbolFilter">Simbolo:</label>
        <select id="symbolFilter"><option value="">Tutti</option></select></div>
    </div>
    <div id="tradesWrap">
      <div class="empty">In attesa di dati…</div>
    </div>
  </div>
</main>

<script>
  // ====== CONFIGURA QUI ======
  const firebaseConfig = {
    apiKey: "AIzaSyACC2UH3ICtaUcOtll4Rvfw9ScNH9iNhWc",
    authDomain: "ea-reporter.firebaseapp.com",
    databaseURL: "https://ea-reporter-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "ea-reporter",
    storageBucket: "ea-reporter.firebasestorage.app",
    messagingSenderId: "779680385090",
    appId: "1:779680385090:web:498c492f1116881832c5db"
  };
  // ============================

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const fmt = (n, c) => (n === undefined || n === null) ? "—" :
    new Intl.NumberFormat("it-IT", {style: c ? "currency" : "decimal", currency: c || undefined, maximumFractionDigits: 2}).format(n);
  const fmtDate = (unixSec) => new Date(unixSec * 1000).toLocaleString("it-IT");
  const fmtDuration = (sec) => {
    if(!sec || sec <= 0) return "—";
    const d = Math.floor(sec / 86400), h = Math.floor((sec % 86400) / 3600), m = Math.floor((sec % 3600) / 60);
    if(d > 0) return `${d}g ${h}h`;
    if(h > 0) return `${h}h ${m}m`;
    if(m > 0) return `${m}m`;
    return `${sec}s`;
  };
  const eaLabel = (t) => (t.comment && t.comment.trim()) ? t.comment.trim() : `Magic ${t.magic ?? 0}`;

  function periodStartTimestamp(key){
    if(key === "today"){
      const d = new Date(); d.setHours(0,0,0,0);
      return Math.floor(d.getTime() / 1000);
    }
    const now = Math.floor(Date.now() / 1000);
    const days = { "7d":7, "30d":30, "90d":90, "365d":365 }[key];
    return days ? now - days * 86400 : 0;
  }
  let currentPeriod = "all";
  const periodSelect = document.getElementById("periodSelect");
  periodSelect.addEventListener("change", (e) => {
    currentPeriod = e.target.value;
    if(currentAccount) watchAccount(currentAccount);
  });

  // ---------- Gestione conti nascosti (solo lato browser, non tocca i dati) ----------
  const HIDDEN_KEY = "eaDashboard_hiddenAccounts";
  const getHidden = () => { try { return JSON.parse(localStorage.getItem(HIDDEN_KEY)) || []; } catch(e){ return []; } };
  const setHidden = (arr) => { try { localStorage.setItem(HIDDEN_KEY, JSON.stringify(arr)); } catch(e){} };
  let showHiddenToo = false;

  let currentAccount = null;
  let allAccountIds = [];
  const accountSelect = document.getElementById("accountSelect");

  db.ref("accounts").on("value", (snap) => {
    const accounts = snap.val() || {};
    allAccountIds = Object.keys(accounts);
    renderAccountSelect();
    if(!currentAccount && allAccountIds.length){
      const hidden = getHidden();
      const visible = allAccountIds.filter(id => !hidden.includes(id));
      currentAccount = (visible[0] || allAccountIds[0]);
      accountSelect.value = currentAccount;
      watchAccount(currentAccount);
    }
  });

  function renderAccountSelect(){
    const hidden = getHidden();
    const ids = showHiddenToo ? allAccountIds : allAccountIds.filter(id => !hidden.includes(id));
    accountSelect.innerHTML = ids.length
      ? ids.map(id => `<option value="${id}">${id}${hidden.includes(id) ? " (nascosto)" : ""}</option>`).join("")
      : "<option>Nessun conto visibile</option>";
    if(currentAccount && ids.includes(currentAccount)) accountSelect.value = currentAccount;
  }

  accountSelect.addEventListener("change", (e) => watchAccount(e.target.value));

  document.getElementById("hideAccountBtn").addEventListener("click", () => {
    if(!currentAccount) return;
    const hidden = getHidden();
    if(!hidden.includes(currentAccount)) hidden.push(currentAccount);
    setHidden(hidden);
    const remaining = allAccountIds.filter(id => !hidden.includes(id));
    currentAccount = remaining[0] || null;
    renderAccountSelect();
    if(currentAccount) watchAccount(currentAccount);
  });

  document.getElementById("showHiddenBtn").addEventListener("click", (e) => {
    showHiddenToo = !showHiddenToo;
    e.target.textContent = showHiddenToo ? "nascondi conti nascosti" : "mostra conti nascosti";
    renderAccountSelect();
  });

  // ---------- Dati del conto selezionato ----------
  let allTrades = [];
  let filters = { magic: "", comment: "", symbol: "" };

  let statusRef = null, tradesRef = null;

  function watchAccount(accountId){
    currentAccount = accountId;
    if(statusRef) statusRef.off();
    if(tradesRef) tradesRef.off();

    statusRef = db.ref(`accounts/${accountId}/status`);
    statusRef.on("value", (snap) => {
      const s = snap.val();
      if(!s) return;
      const currency = s.currency || "";
      document.getElementById("stEquity").textContent = fmt(s.equity, currency);
      document.getElementById("stBalance").textContent = fmt(s.balance, currency);
      const profitEl = document.getElementById("stProfit");
      profitEl.textContent = fmt(s.profit, currency);
      profitEl.className = "value num " + (s.profit >= 0 ? "gain" : "loss");
      const ddEl = document.getElementById("stDD");
      ddEl.textContent = (s.drawdown_pct ?? 0).toFixed(2) + " %";
      ddEl.className = "value num " + (s.drawdown_pct > 5 ? "loss" : "");
      document.getElementById("stBroker").textContent = s.broker || "—";
      document.getElementById("headerBroker").textContent = s.broker ? `— ${s.broker}` : "";
      document.getElementById("stLeverage").textContent = s.leverage ? `1:${s.leverage}` : "—";
      document.getElementById("lastUpdate").textContent = "aggiornato " + fmtDate(s.updated_at);
    });

    const startTs = periodStartTimestamp(currentPeriod);
    let q = db.ref(`accounts/${accountId}/trades`).orderByChild("closed_at");
    q = startTs > 0 ? q.startAt(startTs) : q;
    q = q.limitToLast(5000);
    tradesRef = q;
    tradesRef.on("value", (snap) => {
      const val = snap.val() || {};
      allTrades = Object.values(val).sort((a,b) => b.closed_at - a.closed_at);
      renderPeriodLabel(allTrades);
      renderFilterOptions(allTrades);
      renderTop5(allTrades);
      renderEaSummary(allTrades);
      renderTrades(applyFilters(allTrades));
      hideChartPanel();
    });
  }

  function renderPeriodLabel(trades){
    const el = document.getElementById("periodRangeLabel");
    const fmtD = ts => new Date(ts * 1000).toLocaleDateString("it-IT");
    const now = Math.floor(Date.now() / 1000);
    let startTs = periodStartTimestamp(currentPeriod);
    if(currentPeriod === "all"){
      startTs = trades.length ? Math.min(...trades.map(t => t.closed_at)) : now;
    }
    el.textContent = `Periodo selezionato: dal ${fmtD(startTs)} al ${fmtD(now)}`;
  }

  function applyFilters(trades){
    return trades.filter(t =>
      (filters.magic === "" || String(t.magic ?? 0) === filters.magic) &&
      (filters.comment === "" || eaLabel(t) === filters.comment) &&
      (filters.symbol === "" || t.symbol === filters.symbol)
    );
  }

  const magicFilter = document.getElementById("magicFilter");
  const commentFilter = document.getElementById("commentFilter");
  const symbolFilter = document.getElementById("symbolFilter");
  [["magic", magicFilter], ["comment", commentFilter], ["symbol", symbolFilter]].forEach(([key, el]) => {
    el.addEventListener("change", (e) => {
      filters[key] = e.target.value;
      renderTrades(applyFilters(allTrades));
    });
  });

  function renderFilterOptions(trades){
    const magics = [...new Set(trades.map(t => String(t.magic ?? 0)))].sort();
    const comments = [...new Set(trades.map(eaLabel))].sort();
    const symbols = [...new Set(trades.map(t => t.symbol).filter(Boolean))].sort();
    const rebuild = (el, values, current, labelFn) => {
      el.innerHTML = '<option value="">Tutti</option>' + values.map(v => `<option value="${v}">${labelFn ? labelFn(v) : v}</option>`).join("");
      el.value = values.includes(current) ? current : "";
    };
    rebuild(magicFilter, magics, filters.magic, v => `Magic ${v}`);
    rebuild(commentFilter, comments, filters.comment);
    rebuild(symbolFilter, symbols, filters.symbol);
    filters.magic = magicFilter.value; filters.comment = commentFilter.value; filters.symbol = symbolFilter.value;
  }

  // ---------- Raggruppamento per EA: per commento (default) o per magic number ----------
  let groupMode = "comment"; // "comment" | "magic"
  const groupByCommentBtn = document.getElementById("groupByComment");
  const groupByMagicBtn = document.getElementById("groupByMagic");
  function setGroupMode(mode){
    groupMode = mode;
    groupByCommentBtn.style.fontWeight = mode === "comment" ? "600" : "400";
    groupByMagicBtn.style.fontWeight = mode === "magic" ? "600" : "400";
    document.getElementById("eaSubtitle").textContent = mode === "comment" ? "— raggruppato per commento" : "— raggruppato per magic number";
    renderEaSummary(allTrades);
    renderTop5(allTrades);
  }
  groupByCommentBtn.addEventListener("click", () => setGroupMode("comment"));
  groupByMagicBtn.addEventListener("click", () => setGroupMode("magic"));

  function groupByEa(trades){
    const groups = {};
    trades.forEach(t => {
      const magicKey = String(t.magic ?? 0);
      const commentKey = eaLabel(t);
      const key = groupMode === "magic" ? magicKey : commentKey;
      if(!groups[key]) groups[key] = { name: groupMode === "magic" ? `Magic ${magicKey}` : commentKey, count:0, wins:0, netSum:0, lots:0, durSum:0, durCount:0, magics:new Set(), comments:new Set() };
      const g = groups[key];
      const net = t.net ?? t.profit ?? 0;
      g.count++;
      if(net >= 0) g.wins++;
      g.netSum += net;
      g.lots += (t.volume ?? 0);
      if(t.duration_sec){ g.durSum += t.duration_sec; g.durCount++; }
      g.magics.add(magicKey);
      if(t.comment && t.comment.trim()) g.comments.add(t.comment.trim());
    });
    return Object.values(groups).map(g => {
      const others = groupMode === "magic" ? [...g.comments] : [...g.magics].map(m => `Magic ${m}`);
      g.subtitle = others.length ? (others.length > 3 ? others.slice(0,3).join(", ") + ` +${others.length-3} altri` : others.join(", ")) : (groupMode === "magic" ? "nessun commento" : "");
      return g;
    });
  }

  function renderTop5(trades){
    const wrap = document.getElementById("top5Wrap");
    const groups = groupByEa(trades).sort((a,b) => b.netSum - a.netSum).slice(0, 5);
    if(!groups.length){ wrap.innerHTML = '<div class="empty">Nessuna operazione chiusa ancora</div>'; return; }
    wrap.innerHTML = groups.map((g, i) => `
      <div class="top5row" data-name="${g.name}">
        <div class="top5rank">${i+1}</div>
        <div class="top5name">${g.name}<span class="sub">${g.count} operazioni · win rate ${((g.wins/g.count)*100).toFixed(0)}% ${g.subtitle ? "· " + g.subtitle : ""}</span></div>
        <div class="top5net num" style="color:${g.netSum>=0?'var(--gain)':'var(--loss)'}">${fmt(g.netSum)}</div>
      </div>`).join("");
    wrap.querySelectorAll(".top5row").forEach(el => el.addEventListener("click", () => showEaDetail(el.dataset.name)));
  }

  let eaSortState = { key: "net", dir: -1 };

  function renderEaSummary(trades){
    const wrap = document.getElementById("eaWrap");
    const groups = groupByEa(trades);
    if(!groups.length){ wrap.innerHTML = '<div class="empty">Nessuna operazione chiusa ancora</div>'; return; }

    const cols = [
      {key:"name", label:"EA"},
      {key:"count", label:"Operazioni", num:true},
      {key:"winrate", label:"Win rate", num:true},
      {key:"lots", label:"Lotti tot.", num:true},
      {key:"net", label:"Netto", num:true},
      {key:"avg", label:"Media/trade", num:true},
      {key:"duration", label:"Durata media", num:true}
    ];
    const getVal = (g, key) => {
      if(key === "winrate") return g.wins / g.count;
      if(key === "net") return g.netSum;
      if(key === "avg") return g.netSum / g.count;
      if(key === "duration") return g.durCount ? g.durSum / g.durCount : -1;
      return g[key];
    };
    const sorted = groups.slice().sort((a,b) => {
      let av = getVal(a, eaSortState.key), bv = getVal(b, eaSortState.key);
      if(typeof av === "string") return av.localeCompare(bv) * eaSortState.dir;
      return (av - bv) * eaSortState.dir;
    });

    const head = cols.map(c => {
      const active = eaSortState.key === c.key;
      const arrow = active ? (eaSortState.dir === 1 ? " ▲" : " ▼") : "";
      return `<th class="${c.num?'num':''} sortable" data-key="${c.key}">${c.label}${arrow}</th>`;
    }).join("");
    const rows = sorted.map(g => `
      <tr class="clickable" data-name="${g.name}">
        <td class="eaname">${g.name}${g.subtitle ? `<span class="sub">${g.subtitle}</span>` : ""}</td>
        <td class="num">${g.count}</td>
        <td class="num">${((g.wins/g.count)*100).toFixed(0)}%</td>
        <td class="num">${g.lots.toFixed(2)}</td>
        <td class="num" style="color:${g.netSum>=0?'var(--gain)':'var(--loss)'}">${fmt(g.netSum)}</td>
        <td class="num">${fmt(g.netSum/g.count)}</td>
        <td class="num">${g.durCount ? fmtDuration(g.durSum/g.durCount) : "—"}</td>
      </tr>`).join("");
    wrap.innerHTML = `<table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>`;
    wrap.querySelectorAll("th.sortable").forEach(th => {
      th.addEventListener("click", () => {
        const key = th.dataset.key;
        if(eaSortState.key === key) eaSortState.dir *= -1;
        else { eaSortState.key = key; eaSortState.dir = key === "name" ? 1 : -1; }
        renderEaSummary(trades);
      });
    });
    wrap.querySelectorAll("tr.clickable").forEach(tr => tr.addEventListener("click", () => showEaDetail(tr.dataset.name)));
  }

  let sortState = { key: "closed_at", dir: -1 };

  function sortTrades(trades){
    const key = sortState.key, dir = sortState.dir;
    return trades.slice().sort((a, b) => {
      let av = key === "net" ? (a.net ?? a.profit ?? 0) : (key === "duration_sec" ? (a.duration_sec ?? 0) : a[key]);
      let bv = key === "net" ? (b.net ?? b.profit ?? 0) : (key === "duration_sec" ? (b.duration_sec ?? 0) : b[key]);
      if(typeof av === "string" || typeof bv === "string"){
        av = (av ?? "").toString().toLowerCase();
        bv = (bv ?? "").toString().toLowerCase();
        return av < bv ? -1*dir : av > bv ? 1*dir : 0;
      }
      return ((av ?? 0) - (bv ?? 0)) * dir;
    });
  }

  // ---------- Dettaglio di un singolo EA: filtro + grafico andamento ----------
  function hideChartPanel(){
    document.getElementById("chartPanel").style.display = "none";
  }

  function showEaDetail(name){
    filters.magic = "";
    filters.comment = "";
    if(groupMode === "magic" && name.startsWith("Magic ")){
      const magicVal = name.substring(6);
      filters.magic = [...magicFilter.options].some(o => o.value === magicVal) ? magicVal : "";
    } else {
      filters.comment = [...commentFilter.options].some(o => o.value === name) ? name : "";
    }
    filters.symbol = "";
    commentFilter.value = filters.comment;
    magicFilter.value = filters.magic;
    symbolFilter.value = "";

    const filtered = applyFilters(allTrades);
    renderTrades(filtered);
    renderChartPanel(name, filtered);
    document.getElementById("chartPanel").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function renderChartPanel(name, trades){
    const panel = document.getElementById("chartPanel");
    document.getElementById("chartTitle").innerHTML = `Andamento — ${name} <button class="linkbtn" id="closeChartBtn2" style="float:right">chiudi</button>`;
    document.getElementById("chartWrap").innerHTML = drawEquitySvg(trades);
    document.getElementById("closeChartBtn2").addEventListener("click", hideChartPanel);

    if(trades.length){
      const sorted = trades.slice().sort((a,b) => a.closed_at - b.closed_at);
      const netSum = trades.reduce((s,t) => s + (t.net ?? t.profit ?? 0), 0);
      document.getElementById("chartSummary").innerHTML = `
        <span>Periodo: <b>${fmtDate(sorted[0].closed_at)} → ${fmtDate(sorted[sorted.length-1].closed_at)}</b></span>
        <span>Operazioni: <b>${trades.length}</b></span>
        <span>Netto: <b style="color:${netSum>=0?'var(--gain)':'var(--loss)'}">${fmt(netSum)}</b></span>`;
    } else {
      document.getElementById("chartSummary").innerHTML = "";
    }
    panel.style.display = "block";
  }

  function drawEquitySvg(trades){
    if(!trades.length) return '<div class="empty">Nessuna operazione nel periodo selezionato</div>';
    const sorted = trades.slice().sort((a,b) => a.closed_at - b.closed_at);
    let running = 0;
    const points = sorted.map(t => { running += (t.net ?? t.profit ?? 0); return { x: t.closed_at, y: running }; });

    const W = 700, H = 220, pad = 14;
    const minX = points[0].x, maxX = points[points.length - 1].x;
    const ys = points.map(p => p.y).concat([0]);
    const minY = Math.min(...ys), maxY = Math.max(...ys);
    const scaleX = x => maxX === minX ? W/2 : pad + (x - minX) / (maxX - minX) * (W - 2*pad);
    const scaleY = y => maxY === minY ? H/2 : (H - pad) - (y - minY) / (maxY - minY) * (H - 2*pad);

    const path = points.map((p,i) => `${i===0?'M':'L'}${scaleX(p.x).toFixed(1)},${scaleY(p.y).toFixed(1)}`).join(" ");
    const zeroY = scaleY(0).toFixed(1);
    const finalVal = points[points.length - 1].y;
    const color = finalVal >= 0 ? "#3ddc84" : "#ff5c5c";
    const areaPath = `${path} L${scaleX(maxX).toFixed(1)},${zeroY} L${scaleX(minX).toFixed(1)},${zeroY} Z`;

    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:220px;">
      <line x1="0" y1="${zeroY}" x2="${W}" y2="${zeroY}" stroke="#2a323d" stroke-dasharray="4,4"/>
      <path d="${areaPath}" fill="${color}" opacity="0.08" stroke="none"/>
      <path d="${path}" fill="none" stroke="${color}" stroke-width="2"/>
    </svg>`;
  }

  function renderTrades(trades){
    const wrap = document.getElementById("tradesWrap");
    document.getElementById("tradesSubtitle").textContent = `— ${trades.length} operazioni`;
    if(!trades.length){ wrap.innerHTML = '<div class="empty">Nessuna operazione trovata</div>'; return; }

    const cols = [
      {key:"closed_at", label:"Chiusa il"},
      {key:"symbol", label:"Simbolo"},
      {key:"type", label:"Verso"},
      {key:"volume", label:"Lotti", num:true},
      {key:"comment", label:"Commento"},
      {key:"magic", label:"Magic", num:true},
      {key:"duration_sec", label:"Durata", num:true},
      {key:"net", label:"Netto", num:true}
    ];
    const sorted = sortTrades(trades);
    const rows = sorted.slice(0, 150).map(t => `
      <tr>
        <td>${fmtDate(t.closed_at)}</td>
        <td>${t.symbol || ""}</td>
        <td>${t.type === "buy_close" ? "Buy" : "Sell"}</td>
        <td class="num">${(t.volume ?? 0).toFixed(2)}</td>
        <td>${t.comment || ""}</td>
        <td class="num">${t.magic ?? 0}</td>
        <td class="num">${fmtDuration(t.duration_sec)}</td>
        <td class="num" style="color:${(t.net ?? t.profit) >= 0 ? 'var(--gain)' : 'var(--loss)'}">${fmt(t.net ?? t.profit)}</td>
      </tr>`).join("");
    const head = cols.map(c => {
      const active = sortState.key === c.key;
      const arrow = active ? (sortState.dir === 1 ? " ▲" : " ▼") : "";
      return `<th class="${c.num?'num':''} sortable" data-key="${c.key}">${c.label}${arrow}</th>`;
    }).join("");
    wrap.innerHTML = `<table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>`;
    wrap.querySelectorAll("th.sortable").forEach(th => {
      th.addEventListener("click", () => {
        const key = th.dataset.key;
        if(sortState.key === key) sortState.dir *= -1;
        else { sortState.key = key; sortState.dir = key === "closed_at" ? -1 : 1; }
        renderTrades(trades);
      });
    });
  }
</script>
</body>
